services:
  redis:
    image: redis:latest
    container_name: smit_redis_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:latest
    container_name: smit_mongo_container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redis_mongo_db
    volumes:
      - mongo_data:/data/db

volumes:
  redis_data:
  mongo_data: 